name: Aktualizacja planu
on:
  schedule:
    - cron: "0 * * * *"   # co godzinę
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pdfplumber
      - run: python fetch_plan.py
      - name: Zapisz zmiany
        run: |
          git config user.name "plan-bot"
          git config user.email "plan-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Aktualizacja planu" && git push)
